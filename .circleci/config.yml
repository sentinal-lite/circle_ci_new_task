version: 2.1

orbs:
  docker: circleci/docker@2.8.1
  slack: circleci/slack@5.1.0
  aws-ecr: circleci/aws-ecr@9.3.6
  aws-cli: circleci/aws-cli@5.1.1
  python: circleci/python@2.2.0

parameters:
  org_name:
    type: string
    default: "inhouse"
  app_name:
    type: string
    default: "core-platform"
  build_path:
    type: string
    default: "."
  dockerfile_name:
    type: string
    default: "Dockerfile"
  extra_build_args:
    type: string
    default: ""
  dockerfile_path:
    type: string
    default: "docker"

commands:
  inject_variable:
    description: "This will make sure the persistant state is managed"
    parameters:
      keys:
        type: string
      values:
        type: string
    steps:
      - run: |
          # Split the strings into arrays
          IFS=',' read -r -a keys_array < <(echo "<<parameters.keys>>")
          IFS=',' read -r -a values_array < <(echo "<<parameters.values>>")
          for i in "${!keys_array[@]}"; do
              echo "export ${keys_array[i]}=${values_array[i]}" >> $BASH_ENV
          done
          echo "Environment variables have been dumped to bash.env"
          cp $BASH_ENV bash.env
      - persist_to_workspace:
          root: .
          paths:
            - bash.env
  load_variables:
    description: "This will provide the shared environment variables"
    steps:
      - attach_workspace:
          at: .
      - run: |
          cat bash.env >> $BASH_ENV
  success-slack:
    description: "This is dynamic slack notification to use when an event is success only."
    steps:
      - slack/notify:
          event: pass
          template: success_tagged_deploy_1
  failure-slack:
    description: "This is dynamic slack notification to use when an event is success only."
    steps:
      - slack/notify:
          event: fail
          template: basic_fail_1
  slack-notification-customized:
    description: "This is dynamic slack notification to use."
    parameters:
      message:
        type: string
        default: "Circle CI Job started for project ${CIRCLE_PROJECT_REPONAME} on ${CIRCLE_BRANCH} branch"
    steps:
      - slack/notify:
          custom: |
            {
              "blocks": [
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "plain_text",
                      "text": "<<parameters.message>>",
                      "emoji": true
                    }
                  ]
                }
              ]
            }


jobs:
    notify: 
      parameters:
        message:
          type: string
          default: "Circle CI Job started for project ${CIRCLE_PROJECT_REPONAME} on ${CIRCLE_BRANCH} branch"
      docker:
        - image: 'cimg/base:stable'
      steps:
        - slack-notification-customized:
            message: "<<parameters.message>>"
        - run:
            command: |
              printenv

    linting-and-unit-tests: 
      docker:
        - image: cimg/python:3.12
      steps:
        - checkout
        # - python/install-packages:
        #     pkg-manager: poetry
        #     args: --no-root
        # - run:
        #     command: |
        #       echo "Linting"
        #       peotry run flake8 --version
        #       peotry run flake8 
        # - run: 
        #     command: |
        #       echo "Unit tests"
        #       poetry run pytest --version
        #       poetry run black src tests --check
        #       poetry run isort src tests --check
        - failure-slack
        - run:
            when: on_fail
            name: Add Comment to PR
            command: |
                export PULL_REQUEST_NUMBER=$(echo "${CI_PULL_REQUEST}" | awk -F"/" '{print $7}')
                printenv
                curl -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GITHUB_REPO_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/issues/${PULL_REQUEST_NUMBER}/comments -d '{"body":"Oops! This Pull Request is failed while running test cases. Please check the details."}'

    check-pr-status:
      docker:
        - image: cimg/base:2024.11
      steps:
        - run:
            command: |
                echo "Checking PR status!"
        - run:
            name: Get PR Status
            command: |
              status_code=$(curl -L \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GITHUB_REPO_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -o res.json \
                -w "%{http_code}" \
                "https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/pulls?base=dev&state=open")
              
              if [ $status_code -eq 200 ]; then
                PR_URL=$(jq -r '.[0].html_url' res.json)
                echo "export SLACK_MESSAGE=\"Linting is completed! You can merge a PR: ${PR_URL}\"" >> $BASH_ENV
              else
                echo "export SLACK_MESSAGE=\"Linting is completed! You can now raise a PR!\"" >> $BASH_ENV
              fi
        - slack-notification-customized:
            message: "${SLACK_MESSAGE}"


    docker-build-and-push:
        parameters:
          ecr_repo_name:
            type: string
            default: <<pipeline.parameters.app_name>>
          docker_image_tag:
            type: string
            default: ${CIRCLE_BRANCH}-${CIRCLE_SHA1}-${CIRCLE_BUILD_NUM}
          aws_profile:
            type: string
            default: default
        executor:
          name: aws-ecr/default
        working_directory: ~/application
        steps:
          - checkout
          - run:
              command: |
                aws --version
                jq --version
          - docker/build:
              debug: false 
              docker-context: <<pipeline.parameters.build_path>> 
              dockerfile: <<pipeline.parameters.dockerfile_name>> 
              extra_build_args: <<pipeline.parameters.extra_build_args>> 
              path: <<pipeline.parameters.dockerfile_path>> 
              lint-dockerfile: false 
              image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/<<parameters.ecr_repo_name>> 
              tag: <<parameters.docker_image_tag>>
              treat-warnings-as-errors: false 
          - run:
              command: | 
                echo "Docker Image built with tag ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/<<pipeline.parameters.app_name>>:${CIRCLE_BRANCH}-${CIRCLE_SHA1}-${CIRCLE_BUILD_NUM}"
          - aws-ecr/ecr_login:
              public_registry: false 
              use_credentials_helper: true 
              profile_name: <<parameters.aws_profile>>
          - aws-ecr/push_image:
              public_registry: false 
              repo: <<parameters.ecr_repo_name>> 
              tag: <<parameters.docker_image_tag>>
          - inject_variable:
              keys: "DESTINATION_IMAGE_TAG,SOURCE_IMAGE_TAG,SOURCE_IMAGE_URI"
              values: "${CIRCLE_BRANCH}-${CIRCLE_SHA1}-${CIRCLE_BUILD_NUM}-prod,${CIRCLE_BRANCH}-${CIRCLE_SHA1}-${CIRCLE_BUILD_NUM},${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/<<pipeline.parameters.app_name>>:${CIRCLE_BRANCH}-${CIRCLE_SHA1}-${CIRCLE_BUILD_NUM}"
          - failure-slack
    deploy-ecs-service:
      parameters:
        deploy:
          type: boolean
          default: false
        ecr_repo_name:
          type: string
          default: <<pipeline.parameters.app_name>> 
        docker_image_tag:
          type: string
          default: ${CIRCLE_BRANCH}-${CIRCLE_SHA1}-${CIRCLE_BUILD_NUM}
        deploy_environment: 
          type: string
          default: dev
        task_definition_name:
          type: string
          default: <<pipeline.parameters.app_name>>-<<parameters.deploy_environment>>-td
        ecs_service_name:
          type: string
          default: <<pipeline.parameters.app_name>>
        ecs_cluster_name:
          type: string
          default: <<pipeline.parameters.org_name>>-<<parameters.deploy_environment>>-cluster
      executor:
        name: aws-ecr/default
      working_directory: ~/application
      steps:
        - run:
            environment:
              TASK_DEFINITION: <<parameters.task_definition_name>> # <<pipeline.parameters.app_name>>-<<parameter.deploy_environment>>-td 
            command: |
              printenv
              ECS_DEPLOY="<<parameters.deploy>>"
              if [[ "${ECS_DEPLOY}" == "true" ]]; then 
                echo "<<parameters.ecs_cluster_name>>"
                echo "⛳️ Stage: Update"
                export RELEASE_IMAGE_NAME="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/<<parameters.ecr_repo_name>>:<<parameters.docker_image_tag>>"
                export IMAGE_NAME="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/<<parameters.ecr_repo_name>>"
                aws ecs describe-task-definition --task-definition ${TASK_DEFINITION} > TASK_DEFINITION.json
                cat TASK_DEFINITION.json
                echo "${IMAGE_NAME} ${RELEASE_IMAGE_NAME}"
                jq --arg NEW_IMAGE_NAME "${RELEASE_IMAGE_NAME}" --arg SEARCH_ECR_NAME "${IMAGE_NAME}" '.taskDefinition.containerDefinitions[] | (select(.image|contains($SEARCH_ECR_NAME)) | .image |= $NEW_IMAGE_NAME)' TASK_DEFINITION.json > raw_task_definition.txt
                jq --slurpfile CONTAINER_DEFINITION raw_task_definition.txt --arg SEARCH_ECR_NAME "${IMAGE_NAME}" '.taskDefinition | del(.containerDefinitions[] | (select(.image|contains($SEARCH_ECR_NAME)))) |  .containerDefinitions += $CONTAINER_DEFINITION | del(.taskDefinitionArn) | del(.revision) | del(.status) | del(.requiresAttributes) | del(.compatibilities) | del(.registeredAt) | del(.registeredBy)' TASK_DEFINITION.json > FINAL_TASK_DEFINTIION.json
                aws ecs register-task-definition --family $TASK_DEFINITION --network-mode awsvpc --region=${AWS_DEFAULT_REGION} --cli-input-json file://FINAL_TASK_DEFINTIION.json 2>&1 > /dev/null
                LATEST_TD=$(aws ecs describe-task-definition --task-definition ${TASK_DEFINITION} | jq -cr '.taskDefinition.taskDefinitionArn | split("/") | last')
                echo "Latest Task definition is -> $LATEST_TD "
                aws ecs update-service --service <<parameters.ecs_service_name>> --cluster <<parameters.ecs_cluster_name>> --task-definition ${LATEST_TD} --force-new-deployment | jq '.service.deployments[] | (select(.status=="PRIMARY")) | del(.createdAt) | del(.networkConfiguration) | del(.platformFamily) | del(.desiredCount) | del(.runningCount) | del(.failedTasks) | del(.pendingCount)' > ECS_SERVICE.json
              else
                echo "Deployment flag is not true. Skipping Deployment"
              fi
        - success-slack
        - failure-slack

    create-pr:
      parameters:
        pr_title:
          type: string
          default: ""
        pr_body:
          type: string
          default: ""
        source_branch:
          type: string
          default: feature
        target_branch:
          type: string
          default: dev
      docker:
        - image: cimg/base:2024.11
      steps:
        - run:
            command: |
                echo "PR raised!"
        - run:
            command: |
                echo "https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/pulls"
        - run:
            command: |
                curl -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GITHUB_REPO_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/pulls -d '{"title": "<< parameters.pr_title >>","body": "<< parameters.pr_body >>","head": "<< parameters.source_branch >>","base": "<< parameters.target_branch >>"}'
        - failure-slack


    docker-retag-push:
      executor: aws-cli/default
      working_directory: ~/application
      parameters:
        source_environment:
          type: string
        destination_environment:
          type: string
        source_ecr_repo_name:
          type: string
        destination_ecr_repo_name:
          type: string
        aws_source_credentials_profile:
          type: string
        aws_destination_credentials_profile:
          type: string
        source_image_tag:
          type: string
        destination_image_tag:
          type: string
      steps:
        - load_variables
        - aws-cli/install
        - aws-cli/setup:
            profile_name: <<parameters.aws_source_credentials_profile>>
        - aws-cli/setup:
            profile_name: <<parameters.aws_destination_credentials_profile>>
            aws_access_key_id: AWS_PROD_AWS_ACCESS_KEY_ID
            aws_secret_access_key: AWS_PROD_SECRET_KEY_ID
            region: AWS_PROD_DEFAULT_REGION
        - attach_workspace:
            at: .
        - aws-ecr/ecr_login:
            public_registry: false 
            use_credentials_helper: false 
            profile_name: <<parameters.aws_source_credentials_profile>>
        - setup_remote_docker
        - run:
            command: |
              printenv
              docker --version
              docker pull ${SOURCE_IMAGE_URI}
              docker tag ${SOURCE_IMAGE_URI} ${AWS_PROD_ACCOUNT_ID}.dkr.ecr.${AWS_PROD_DEFAULT_REGION}.amazonaws.com/<<parameters.destination_ecr_repo_name>>:${DESTINATION_IMAGE_TAG}
        - aws-ecr/ecr_login:
            account_id: ${AWS_PROD_ACCOUNT_ID}
            region: ${AWS_PROD_DEFAULT_REGION}
            public_registry: false 
            use_credentials_helper: false 
            profile_name: <<parameters.aws_destination_credentials_profile>>
        - aws-ecr/push_image:
            public_registry: false 
            repo: <<parameters.destination_ecr_repo_name>> 
            tag: ${SOURCE_IMAGE_TAG}-prod
            account_id: ${AWS_PROD_ACCOUNT_ID}
            region: ${AWS_PROD_DEFAULT_REGION}
        - success-slack
        - failure-slack

    create-branch:
      docker:
        - image: cimg/base:2024.11
      steps:
        - load_variables
        - run:
            name: Create branch    
            command: |
                curl -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GITHUB_REPO_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/Lexxa-AI/${CIRCLE_PROJECT_REPONAME}/git/refs \
                -d '{
                  "ref": "refs/heads/${SOURCE_IMAGE_TAG}-prod",
                  "sha": "${CIRCLE_SHA1}"
                }'

workflows:
  inhouse-core-workflow:
    jobs:
      - notify:
          context: slack-secrets

      - linting-and-unit-tests:
          name: pr-lint-test
          filters:
            branches:
              ignore:
                - main
                - dev
                - staging
          requires:
            - notify
          context: 
            - slack-secrets
            - Github-secrets

      - check-pr-status:
          name: check-pr-exists-or-not
          context: 
            - Github-secrets
            - slack-secrets
          requires:
            - pr-lint-test
          filters:
            branches:
              ignore:
                - main
                - dev
                - staging

      - notify:
          name: send-approval-feature-to-dev-notification
          context: slack-secrets
          message: Linting and Unit test cases ran successfully. You can raise a PR or merge the already existing PR
          filters:
            branches:
              ignore:
                - dev
                - staging
                - main
          requires:
            - pr-lint-test

      - docker-build-and-push:
          context: 
            - AWS
            - slack-secrets
          filters:
            branches:
              only:
                - dev
                - staging

      - deploy-ecs-service:
          name: dev-environment-deployment
          deploy: false
          deploy_environment: ${CIRCLE_BRANCH}
          ecr_repo_name: <<pipeline.parameters.app_name>>
          task_definition_name: <<pipeline.parameters.app_name>>-${CIRCLE_BRANCH}-td
          ecs_service_name: <<pipeline.parameters.org_name>>-<<pipeline.parameters.app_name>>
          ecs_cluster_name: <<pipeline.parameters.org_name>>-${CIRCLE_BRANCH}-cluster
          context: 
            - AWS
            - slack-secrets
          requires:
            - docker-build-and-push
          filters:
            branches:
              only:
                - dev
      - deploy-ecs-service:
          name: staging-environment-deployment
          deploy: false
          deploy_environment: ${CIRCLE_BRANCH}
          ecr_repo_name: <<pipeline.parameters.app_name>>
          task_definition_name: <<pipeline.parameters.app_name>>-${CIRCLE_BRANCH}-td
          ecs_service_name: <<pipeline.parameters.org_name>>-<<pipeline.parameters.app_name>>
          ecs_cluster_name: <<pipeline.parameters.org_name>>-${CIRCLE_BRANCH}-cluster
          context: 
            - AWS
            - slack-secrets
          requires:
            - docker-build-and-push
          filters:
            branches:
              only:
                - staging
      - notify:
          name: send-staging-approval-slack-notification
          context: slack-secrets
          message: Code is deployed to dev environment. Developer Please perform the sanity and once done, approve on Circle CI.
          requires:
            - dev-environment-deployment
          filters:
            branches:
              only:
                - dev
      - notify:
          name: send-production-approval-slack-notification
          context: slack-secrets
          message: Code is deployed to dev environment. QA Please perform the sanity and once done, Maintainers on Circle CI. Once approved this will trigger the production deployment.
          requires:
            - staging-environment-deployment
          filters:
            branches:
              only:
                - staging

      - staging-approval:
          type: approval
          requires:
            - send-staging-approval-slack-notification
          filters:
            branches:
              only:
                - dev

      - production-approval:
          type: approval
          requires:
            - send-production-approval-slack-notification
          filters:
            branches:
              only:
                - staging

      - create-pr:
          name: pr-from-dev-to-staging-branch
          context: 
            - Github-secrets
            - slack-secrets
          source_branch: dev
          target_branch: staging
          pr_title: "[CircleCI] Merge code from dev to staging"
          pr_body: "This is an automated pull request generated by Circle CI agent as the code is approved on dev environment and is ready to be deployed and tested out on staging"
          requires:
            - staging-approval
          filters:
            branches:
              only:
                - dev
          
      - docker-retag-push:
          name: create-production-tag
          source_environment: staging
          destination_environment: production
          source_ecr_repo_name: <<pipeline.parameters.app_name>>
          destination_ecr_repo_name: <<pipeline.parameters.app_name>>
          source_image_tag: ${CIRCLE_BRANCH}-${CIRCLE_SHA1}-${CIRCLE_BUILD_NUM}
          destination_image_tag: ${CIRCLE_BRANCH}-${CIRCLE_SHA1}-${CIRCLE_BUILD_NUM}-production
          aws_source_credentials_profile: staging
          aws_destination_credentials_profile: production
          requires:
            - production-approval
          context: 
            - AWS
            - AWS_PROD
            - slack-secrets

      - deploy-ecs-service:
          name: production-environment-deployment
          deploy: false
          deploy_environment: production
          ecr_repo_name: <<pipeline.parameters.app_name>>
          task_definition_name: <<pipeline.parameters.app_name>>-production-td
          ecs_service_name: <<pipeline.parameters.org_name>>-<<pipeline.parameters.app_name>>
          ecs_cluster_name: <<pipeline.parameters.org_name>>-production-cluster
          context: 
            - AWS_PROD	
            - slack-secrets
          requires:
            - create-production-tag

      - create-branch:
          name: create-duplicate-branch
          filters:
            branches:
              only:
                - staging
          requires:
            - production-environment-deployment

      - create-pr:
          name: pr-from-staging-to-main-branch
          source_branch: staging
          target_branch: main
          pr_title: "[CircleCI] Merge code from staging to master"
          pr_body: "This is an automated pull request generated by Circle CI agent as the code is approved on staging environment and is ready to be deployed and tested out on production. Deployment is done on production, so only merge if you think that this deployment is working fine."
          requires:
            - production-environment-deployment
          context:
            - slack-secrets
            - Github-secrets

      
      - notify:
          name: send-approval-staging-to-prod-notification
          context: slack-secrets
          message: PR approval waiting -> ${CIRCLE_PULL_REQUEST}
          filters:
            branches:
              only:
                - staging

      - create-github-tag:
          name:       